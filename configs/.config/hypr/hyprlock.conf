source = /home/jhony/.cache/wal/colors-hyprland.conf

# BACKGROUND
background {
    monitor =
    path = /tmp/wallpaper 
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.2696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Time-Hour
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H")</span>"
    color = $color5
    font_size = 175
    font_family = BitstromWera Nerd Font Mono Black
    position = 0, 200
    halign = center
    valign = center
}

# Time-Minute
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%M")</span>"
    color = $color2
    font_size = 175
    font_family = BitstromWera Nerd Font Mono Black
    position = 0, 0
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B, %a.")"
    color = $color5
    font_size = 22
    font_family = BitstromWera Nerd Font Mono
    position = 0, 450
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =  $USER
    color = $foreground
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 22
    font_family = BitstromWera Nerd Font Mono Bold
    position = 0, -270
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $color1
    inner_color = $background
    font_color = $foreground
    fade_on_empty = false
    font_family = BitstromWera Nerd Font Mono
    placeholder_text = <span foreground="##ffffff99">🔒 Enter Pass</span>
    hide_input = false
    position = 0, -340
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/songdetail.sh)" 
    color = $color7
    font_size = 18
    font_family = BitstromWera Nerd Font Mono
    position = 0, 20
    halign = center
    valign = bottom
}
