# For obvious reasons, this is in Spanish beacuse I am from Spain! :D
# Change accordingly to your language preferences. Same goes for weather city
language = "es-ES"
region = "es-ES"

# MODULES
[updates]
check_cmd = "checkupdates; yay -Qua"
update_cmd = 'kitty bash -c "yay -Syu && echo Listo, presiona ENTER para salir; read" &'
interval = 1800

outputs = "All"
position = "Top"
layer = "Top"

[osd]
enabled = true   
timeout = 1500
show_volume_percentage = true
show_brightness_percentage = true

[animations]
enabled = true

[modules]
left = [ "SystemInfo", "Tempo", "Workspaces"]
center = [ "WindowTitle"]
right = [ "MediaPlayer" , [ "Updates", "Tray", "Settings"]]

[settings]
lock_cmd = "$HOME/.config/hypr/hyprlock/scripts/lock.sh &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"
hibernate_cmd = "systemctl hibernate"
indicators = ["Bluetooth", "Network", "Brightness", "Audio", "Microphone", "Battery"]

battery_format = "IconAndTime"
brightness_indicator_format = "IconAndPercentage"
audio_indicator_format = "IconAndPercentage"
microphone_indicator_format = "IconAndPercentage"
peripheral_battery_format = "Time"
peripheral_indicators = "All"
volume_step = 1

[media_player]
max_title_length = 50
indicator_format = "IconAndTitle"

[system_info]
indicators = [ "Cpu", "Memory", "Temperature"]
interval = 5

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80
format = "Percentage"

[system_info.memory]
warn_threshold = 70
alert_threshold = 85
format = "Percentage"

[system_info.disk]
warn_threshold = 80
alert_threshold = 90
format = "Percentage"

[system_info.temperature]
warn_threshold = 60
alert_threshold = 80
sensor = "Cpu"


[tempo]
clock_format = "%H:%M"
weather_location = { City = "Madrid" }
weather_indicator = "IconAndTemperature"

[window_title]
mode = "Class"
truncate_title_after_length = 75

# APPEARANCE
[appearance]
font_name = "NotoSansM Nerd Font Mono Bold"
scale_factor = 1.3
style = "Solid"
success_color = "#3E6B82"
warning_color = "#4C738D"
danger_color = "#A7B475"
text_color = "#ced1d0"
workspace_colors = [ "#B96FB3", "#55939F", "#5FACDE" ]

[appearance.primary_color]
base = "#B96FB3"
text = "#111519"

[appearance.background_color]
base = "#111519"
weak = "#111519"
strong = "#909291"
