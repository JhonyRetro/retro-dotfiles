language = "es-ES"
region = "es-ES"

# MODULES
[updates]
check_cmd = "checkupdates; yay -Qua; flatpak list --columns=application,version,latest --app | awk '$2 != $3 {print $1 \" \" $2 \" -> \" $3}' "
update_cmd = 'kitty bash -c "yay -Syu; flatpak update && echo Listo, presiona ENTER para salir; read" &'
interval = 1800

outputs = "All"
position = "Top"
layer = "Top"

[osd]
enabled = true   
timeout = 1500
show_volume_percentage = true
show_brightness_percentage = true

[animations]
enabled = true

[modules]
left = [ "SystemInfo", "Tempo", "Workspaces"]
center = [ "WindowTitle"]
right = [ "MediaPlayer" , [ "Updates", "Tray", "Settings", "CustomNotifications"]]

[settings]
lock_cmd = "$HOME/.config/hypr/hyprlock/scripts/lock.sh &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"
hibernate_cmd = "systemctl hibernate"
indicators = ["Bluetooth", "Network", "Brightness", "Audio", "Microphone", "Battery"]

battery_format = "IconAndPercentageAndTime"
brightness_indicator_format = "IconAndPercentage"
audio_indicator_format = "IconAndPercentage"
microphone_indicator_format = "IconAndPercentage"
peripheral_battery_format = "Time"
peripheral_indicators = "All"
volume_step = 1

[media_player]
max_text_length = 30
indicator_format = "IconAndTitle"
indicator_fields = ["Title"]
menu_visualizer = true
indicator_visualizer = "Before"

[system_info]
indicators = [ "Cpu", "Memory", "Temperature"]
interval = 5

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80
format = "Percentage"

[system_info.memory]
warn_threshold = 70
alert_threshold = 85
format = "Percentage"

[system_info.disk]
warn_threshold = 80
alert_threshold = 90
format = "Percentage"

[system_info.temperature]
warn_threshold = 60
alert_threshold = 80
sensor = "Cpu"

[tempo]
clock_format = "%H:%M"
weather_location = { City = "Madrid" }
weather_indicator = "IconAndTemperature"

[window_title]
mode = "Title"
truncate_title_after_length = 35

[workspaces]
disable_special_workspaces = true
visibility_mode = "MonitorSpecific"
group_by_monitor = true

[[CustomModule]]
name = "CustomNotifications"
icon = ""
command = "swaync-client -t -sw"
on_right_click = "swaync-client -d"
listen_cmd = "swaync-client -swb"
icons.'dnd.*' = ""
alert = ".*notification"

# APPEARANCE
[appearance]
font_name = "NotoSansM Nerd Font Mono Bold"
scale_factor = 1.2
success_color = "#AA778A"
warning_color = "#7096AD"
danger_color = "#60748C"
text_color = "#c3d7dd"
workspace_colors = [ "#B88FA8", "#A497A0", "#C79FA0" ]
opacity = 0.8
backdrop = 0.3
blur = "always"

[appearance.bar]
surface = "solid"

[appearance.primary_color]
base = "#B88FA8"
text = "#181b22"

[appearance.background_color]
base = "#181b22"
weak = "#181b22"
strong = "#88969a"
